version: '3.8'

services:
  backend:
    build: ./backend
    container_name: backend-app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/weights:/app/weights
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - marine-network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://backend:8000
    container_name: frontend-app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - marine-network
    depends_on:
      - backend

networks:
  marine-network:
    driver: bridge